<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Print not found · {{BRAND_NAME}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .error {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .error__code {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(6rem, 18vw, 14rem);
      color: var(--accent);
      line-height: 1;
      letter-spacing: -.05em;
    }
    .error__title {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      margin: 1rem 0 0.5rem;
    }
    .error__lead {
      color: var(--ink-mute);
      max-width: 480px;
      margin: 0 auto 2rem;
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main class="error">
    <div class="error__code">404</div>
    <h1 class="error__title">Print not found.</h1>
    <p class="error__lead">
      Looks like this design got lost in the slicer. Head back home to find what
      you were looking for.
    </p>
    <a href="/" class="btn btn--primary">← Back to home</a>
  </main>
</body>
</html>
