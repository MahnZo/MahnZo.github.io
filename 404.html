<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Match Not Found · Pixl Forge</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .error {
      min-height: 88vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem var(--gutter);
      background: radial-gradient(ellipse at top, var(--pitch) 0%, var(--pitch-deep) 50%, var(--ink) 100%);
    }
    .error__code {
      font-family: var(--font-display);
      font-size: clamp(7rem, 22vw, 16rem);
      letter-spacing: .02em;
      line-height: 1;
      background: linear-gradient(180deg, var(--gold-bright), var(--gold-deep));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .error__title {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 5vw, 3rem);
      letter-spacing: .03em;
      color: var(--chalk);
      margin: 0 0 .5rem;
    }
    .error__lead {
      color: var(--paper-mute);
      max-width: 480px;
      margin: 0 auto 2rem;
    }
  </style>
</head>
<body>
  <div class="error">
    <div class="error__code">404</div>
    <h1 class="error__title">Off the pitch.</h1>
    <p class="error__lead">
      That page rolled out of bounds. Head back to the home stretch.
    </p>
    <a href="/" class="btn btn--gold">← Back to Pixl Forge</a>
  </div>
</body>
</html>
